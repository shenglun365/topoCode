<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var t = 'dark'
      try {
        var s = localStorage.getItem('topoone-theme-workbench')
          || localStorage.getItem('topoone-active-theme')
          || localStorage.getItem('theme')
        if (s === 'dark' || s === 'light') t = s
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t)
    })()
  </script>
  <title>TopoCode · 知识库构建和管理</title>
  <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: dark)" href="/assets/star-logo-mark-v8.svg">
  <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: light)" href="/assets/star-logo-mark-v8-light.svg">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    #app {
      min-height: 100%;
    }
    .app-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-size: 16px;
      color: #a6adc8;
    }
  </style>
</head>
<body>
  <div id="app"><div class="app-loading">加载中...</div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
