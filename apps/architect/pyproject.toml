[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topoone-app-architect"
version = "0.1.0"
description = "TopoCode architect backend: Architect workbench (semantic assets/requirements/design/coding agent/MCP collab) (kind=service, port 3470)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "TopoCodeProj Team", email = "topocode@163.com" },
]
# 依赖核心包（db 层 + http_logging）；fastapi/uvicorn/pyzmq/websockets 由核心传递。
dependencies = [
  "topoone-core",
  "fastapi==0.136.3",
  "uvicorn==0.48.0",
  "pyzmq==27.1.0",
]

[tool.setuptools.packages.find]
include = ["topoone_app_architect*"]
