name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check (all workspaces)
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Frontend unit tests (workbench + web-core)
        run: npm run test:fe

      - name: Build (core bundle + portal + apps)
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install core + app packages (editable, align scripts/setup.sh)
        run: pip install -e packages/core -e apps/workbench -e apps/docs -e apps/chat -e apps/architect

      - name: Backend tests (core + apps)
        run: npm run test:py
