<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1294E8"/>
      <stop offset="100%" stop-color="#0C5FB2"/>
    </radialGradient>
    <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowB" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="#1B6FC0" stroke-width="1.8" opacity="0.5">
    <line x1="101.7" y1="50" x2="147.6" y2="57.2"/>
    <line x1="147.6" y1="57.2" x2="151.5" y2="107.2"/>
    <line x1="151.5" y1="107.2" x2="131.9" y2="160"/>
    <line x1="131.9" y1="160" x2="101.7" y2="50"/>
    <line x1="131.9" y1="160" x2="76.7" y2="142"/>
    <line x1="76.7" y1="142" x2="39.8" y2="118.4"/>
    <line x1="39.8" y1="118.4" x2="59.1" y2="63.2"/>
  </g>

  <g>
    <circle cx="100" cy="100" r="30" fill="none" stroke="#1B6FC0" stroke-width="1.2" opacity="0.3"/>
    <circle cx="100" cy="100" r="20" fill="none" stroke="#1B6FC0" stroke-width="0.8" opacity="0.2"/>
    <circle cx="100" cy="100" r="17" fill="url(#starGrad)" filter="url(#glowB)"/>
    <circle cx="100" cy="100" r="8" fill="url(#starGrad)"/>
    <circle cx="100" cy="100" r="3.6" fill="#FFFFFF"/>
  </g>

  <g>
    <circle cx="101.7" cy="50" r="11.2" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="101.7" cy="50" r="4" fill="#FFFFFF"/>
    <circle cx="147.6" cy="57.2" r="11.2" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="147.6" cy="57.2" r="4" fill="#FFFFFF"/>
    <circle cx="151.5" cy="107.2" r="11.2" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="151.5" cy="107.2" r="4" fill="#FFFFFF"/>
    <circle cx="131.9" cy="160" r="11.2" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="131.9" cy="160" r="4" fill="#FFFFFF"/>
    <circle cx="76.7" cy="142" r="9.6" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="76.7" cy="142" r="3.4" fill="#FFFFFF"/>
    <circle cx="39.8" cy="118.4" r="9.6" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="39.8" cy="118.4" r="3.4" fill="#FFFFFF"/>
    <circle cx="59.1" cy="63.2" r="9.6" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="59.1" cy="63.2" r="3.4" fill="#FFFFFF"/>
  </g>
</svg>
