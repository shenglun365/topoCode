<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1294E8"/>
      <stop offset="100%" stop-color="#0C5FB2"/>
    </radialGradient>
    <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowB" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="#1B6FC0" stroke-width="1.8" opacity="0.5" stroke-linejoin="round" stroke-linecap="round">
    <line x1="100" y1="42" x2="145.3" y2="63.8"/>
    <line x1="145.3" y1="63.8" x2="156.5" y2="112.9"/>
    <line x1="156.5" y1="112.9" x2="125.2" y2="152.3"/>
    <line x1="125.2" y1="152.3" x2="74.8" y2="152.3"/>
    <line x1="74.8" y1="152.3" x2="43.5" y2="112.9"/>
    <line x1="43.5" y1="112.9" x2="54.7" y2="63.8"/>
    <line x1="54.7" y1="63.8" x2="100" y2="42"/>
  </g>

  <g>
    <circle cx="100" cy="100" r="30" fill="none" stroke="#1B6FC0" stroke-width="1.2" opacity="0.3"/>
    <circle cx="100" cy="100" r="20" fill="none" stroke="#1B6FC0" stroke-width="0.8" opacity="0.2"/>
    <circle cx="100" cy="100" r="17" fill="url(#starGrad)" filter="url(#glowB)"/>
    <circle cx="100" cy="100" r="8" fill="url(#starGrad)"/>
    <circle cx="100" cy="100" r="3.6" fill="#FFFFFF"/>
  </g>

  <g>
    <circle cx="100" cy="42" r="11.2" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="100" cy="42" r="4" fill="#FFFFFF"/>
    <circle cx="145.3" cy="63.8" r="11.2" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="145.3" cy="63.8" r="4" fill="#FFFFFF"/>
    <circle cx="156.5" cy="112.9" r="11.2" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="156.5" cy="112.9" r="4" fill="#FFFFFF"/>
    <circle cx="125.2" cy="152.3" r="11.2" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="125.2" cy="152.3" r="4" fill="#FFFFFF"/>
    <circle cx="74.8" cy="152.3" r="9.6" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="74.8" cy="152.3" r="3.4" fill="#FFFFFF"/>
    <circle cx="43.5" cy="112.9" r="9.6" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="43.5" cy="112.9" r="3.4" fill="#FFFFFF"/>
    <circle cx="54.7" cy="63.8" r="9.6" fill="url(#starGrad)" filter="url(#glowS)"/>
    <circle cx="54.7" cy="63.8" r="3.4" fill="#FFFFFF"/>
  </g>
</svg>
