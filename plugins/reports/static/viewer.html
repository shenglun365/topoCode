      console.log('[fileCommToggle] open=' + p.classList.contains('open'));
      if (p.classList.contains('open')) {
        RightPanel.renderPanel();
        requestAnimationFrame(function() { fitPanelPosition(document.getElementById('fileCommFloat')); });
      }
    };
  },

  renderPanel() {
    console.log('[R-panel] S.tab=' + S.tab + ' S.cid=' + S.cid + ' S.et=' + S.et + ' S.gran=' + S.gran + ' S.depth=' + S.depth);
    var panel = document.getElementById('fileCommPanel');
    var isExt = S.et === 'EXTERNAL_INCLUDE' || S.et === 'EXTERNAL_CALL';
    // Row 1: edge type tabs
    var h = '<div class="right-panel-toolbar" style="display:flex;align-items:center;gap:4px;margin-bottom:2px;padding-bottom:3px;border-bottom:1px solid var(--border);flex-wrap:wrap">';
    // Row 2: edge type tabs
    h += '<div class="right-panel-toolbar" style="display:flex;align-items:center;gap:4px;padding-top:2px;flex-wrap:wrap">';
    h += '<div class="et-tabs">';
    h += '<button class="et-tab' + (S.et === 'INCLUDE' ? ' active' : '') + '" data-et="INCLUDE">\u5185\u90e8\u4f9d\u8d56</button>';
    h += '<button class="et-tab' + (S.et === 'EXTERNAL_INCLUDE' ? ' active' : '') + '" data-et="EXTERNAL_INCLUDE">\u5916\u90e8\u4f9d\u8d56</button>';
    h += '<button class="et-tab' + (S.et === 'CALL' ? ' active' : '') + '" data-et="CALL">\u5185\u90e8\u8c03\u7528</button>';
    h += '<button class="et-tab' + (S.et === 'EXTERNAL_CALL' ? ' active' : '') + '" data-et="EXTERNAL_CALL">\u5916\u90e8\u8c03\u7528</button>';
    h += '</div></div>';
    // Row 3: depth + timeout
    h += '<div class="right-panel-toolbar" style="display:flex;align-items:center;gap:4px;padding-top:2px;flex-wrap:wrap">';
    if (S.gran === 'component') {
      h += '<label style="font-size:10px;color:var(--text-muted)">\u6df1\u5ea6: <select id="depthSelect" style="font-size:10px;padding:1px 2px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text)">';
      for (var d = 1; d <= 5; d++) {
        h += '<option value="' + d + '"' + (S.depth === d ? ' selected' : '') + '>' + d + '</option>';
      }
      h += '</select></label>';
      h += '<span class="tab-sep">|</span>';
    }
    var timeoutSec = S.layoutTimeout / 1000 || 60;
    h += '<label style="font-size:10px;color:var(--text-muted)">\u8d85\u65f6: <select id="layoutTimeoutSelect" style="font-size:10px;padding:1px 2px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text)">';
    var topts = [30, 60, 90, 120];
    for (var ti = 0; ti < topts.length; ti++) {
      h += '<option value="' + topts[ti] + '"' + (timeoutSec === topts[ti] ? ' selected' : '') + '>' + topts[ti] + 's</option>';
    }
    h += '</select></label>';
    h += '</div>';
    // Separator
    h += '<hr class="right-panel-hr">';
    // Community list
    h += '<div id="rightCommList"><div class="loading">\u52a0\u8f7d\u4e2d...</div></div>';
    panel.innerHTML = h;
    this.attachToolbarHandlers(panel);
    this.loadCommTree();
    RightBreadcrumb.render();
  },

  attachToolbarHandlers(panel) {
    panel.querySelectorAll('.et-tab').forEach(function(btn) {
      btn.onclick = function() {
        panel.querySelectorAll('.et-tab').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        S.et = this.dataset.et;
        // 外部依赖/调用 → 强制组件模式
        if (S.et === 'EXTERNAL_INCLUDE' || S.et === 'EXTERNAL_CALL') {
          S.gran = 'component';
        }
        S.commParent = '';
        S.commStack = [];
        _rootEntryEt = S.et;
        StateStore.commit({cid: '', et: S.et, gran: S.gran});
        RightPanel.renderPanel();
        RightPanel.loadCommTree();
        RightPanel.loadViz();
        RightBreadcrumb.render();
      };
    });
    var ds = document.getElementById('depthSelect');
    if (ds) ds.onchange = function() {
      StateStore.commit({depth: parseInt(this.value) || 1});
      RightPanel.loadViz();
    };
    var ts = document.getElementById('layoutTimeoutSelect');
    if (ts) ts.onchange = function() {
      StateStore.commit({layoutTimeout: parseInt(this.value) * 1000});
    };
  },

  async loadCommTree() {
    var container = document.getElementById('rightCommList');
    if (!container) return;
    container.innerHTML = '<div class="loading">\u52a0\u8f7d\u4e2d...</div>';
    try {
      var children = await API.communityChildren(S.taskId, S.commParent, S.et);
      var h = '';
      if (children && children.length > 0) {
        h = '<ul>';
        for (var ci = 0; ci < children.length; ci++) {
          var child = children[ci];
          var cls = (S.cid === child.commId) ? ' active' : '';
          var cname = child.name || child.commId;
          h += '<li><span class="fc-link' + cls + '" data-cid="' + escapeAttr(child.commId) + '" data-name="' + escapeAttr(cname) + '" data-has-doc="' + (child.hasDoc ? '1' : '0') + '">' + escapeHtml(cname) + '</span></li>';
        }
        h += '</ul>';
      } else {
        h = '<div style="font-size:10px;color:var(--text-muted);padding:8px;text-align:center">\u6ca1\u6709\u4e0b\u7ea7\u7ec4\u4ef6</div>';
      }
      container.innerHTML = h;
      this.attachCommHandlers(container);
    } catch(e) {
      container.innerHTML = '<div style="font-size:10px;color:var(--text-muted);padding:4px">\u52a0\u8f7d\u5931\u8d25</div>';
    }
  },

  attachCommHandlers(container) {
    container.querySelectorAll('.fc-link').forEach(function(el) {
      el.onclick = function() {
        var cid = this.dataset.cid;
        var name = this.dataset.name;
        S.commParent = cid;
        if (S.commStack.length === 0) _rootEntryEt = S.et;
        S.commStack.push({cid: cid, name: name, et: S.et});
        StateStore.commit({cid: cid, depth: 1});
        RightPanel.loadCommTree();
        RightPanel.loadViz();
        RightBreadcrumb.render();
      };
    });
  },

  refresh() {
    this.renderPanel();
    this.loadViz();
  }
};

// ---- 6f. GraphView ----
const GraphView = {

  async load() {
    var container = document.getElementById('forceGraph');
    if (!container) return;
    // 先销毁旧 Cytoscape 实例，再清除 DOM（避免 g_cy.destroy() 访问已清除的元素）
    if (g_cy) { g_cy.destroy(); g_cy = null; }
    var cyContainer = document.getElementById('cyContainer') || container;
    cyContainer.innerHTML = '';
    var cid = S.cid || '';
    console.log('[G-load] cid=' + cid.slice(0,40) + ' et=' + S.et + ' gran=' + S.gran + ' depth=' + S.depth + ' tab=' + S.tab);
    try {
      var isExternal = S.et === 'EXTERNAL_INCLUDE' || S.et === 'EXTERNAL_CALL';
      var loadET = S.et;
      var data;
      if (isExternal) {
        data = await API.graphExternalLoad(S.taskId, loadET, S.cid || '', S.depth || 1);
        console.log('[G-load-ext] drill=' + (S.cid||'') + ' nodes=' + (data.nodes ? data.nodes.length : 0) + ' edges=' + (data.edges ? data.edges.length : 0));
      } else {
        data = await API.communityGraph(S.taskId, loadET, cid, S.gran);
        // 后端返回节点数上限错误
        if (data && data.error) {
          var errEl = document.getElementById('graphError');
          var msgEl = document.getElementById('graphErrorMsg');
          if (errEl && msgEl) { msgEl.textContent = data.message || '\u8282\u70b9\u8fc7\u591a'; errEl.style.display = 'flex'; }
          return;
        }
      }

      if (!data.nodes || data.nodes.length === 0) {
        cyContainer.innerHTML = '<div class="loading">\u6682\u65e0\u6570\u636e</div>';
        return;
      }

      var isComponent = S.gran === 'component';
      var cssText = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#333';

      // BFS 分配颜色：根层按 ID 排序均匀取色，子层继承父层色系变浅
      var renderNodes = data.nodes;
      var renderEdges = data.edges;
      console.log('[G-load-cy] renderNodes=' + renderNodes.length + ' renderEdges=' + renderEdges.length);

      var nodeStyle = isComponent
        ? { label: 'data(label)', 'font-size': '10px', 'text-valign': 'center', 'text-halign': 'center', color: cssText, 'background-color': '#4d6bfe', width: 30, height: 30 }
        : { label: 'data(label)', 'font-size': '8px', 'text-valign': 'center', 'text-halign': 'center', color: cssText, 'background-color': '#8b5cf6', width: 20, height: 20, 'text-wrap': 'wrap', 'text-max-width': '80px' };

      g_cy = cytoscape({
        container: document.getElementById('cyContainer'),
        elements: [
          ...renderNodes.map(function(n) {
            if (isExternal) {
              if (n.isExternal) return { data: { id: n.id, label: n.label, isExternal: true } };
              return { data: { id: n.id, label: n.label, hasChildren: n.hasChildren !== false } };
            }
            if (isComponent) return { data: { id: n.id, label: n.label, hasChildren: n.hasChildren !== false } };
            return { data: { id: n.id, label: n.label, commId: n.commId } };
          }),
          ...renderEdges.map(function(e) {
            var ed = { id: e.id, source: e.source, target: e.target };
            if (e.bidirectional) ed.bidirectional = true;
            return { data: ed };
          })
        ],
        style: [
          { selector: 'node', style: nodeStyle },
          { selector: 'node[isExternal]', style: { 'background-color': '#f59e0b', shape: 'ellipse', width: 30, height: 30, label: 'data(label)', 'font-size': '9px', 'text-valign': 'center', 'text-halign': 'center', color: cssText } },
          { selector: 'edge', style: { width: 1, 'line-color': '#999', 'target-arrow-color': '#999', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier' } },
          { selector: 'edge[bidirectional]', style: { 'source-arrow-shape': 'triangle', 'source-arrow-color': '#999' } },
          { selector: 'node:selected', style: { 'border-width': 2, 'border-color': '#ff6b6b' } },
          { selector: '.center-highlight', style: { 'border-width': 4, 'border-color': '#4d6bfe', 'border-opacity': 1 } },
        ],
        layout: null,
        userZoomingEnabled: true, userPanningEnabled: true, minZoom: 0.15, maxZoom: 4,
        boxSelectionEnabled: false, autounselectify: true,
      });
      g_cy.resize();
      console.log('[G-load-cy] after resize: cyNodes=' + g_cy.nodes().length + ' cyEdges=' + g_cy.edges().length);

      // 统一着色：祖先链追溯，稳定色相继承（跳过外部节点）
      if (!isExternal) {
        // 每个节点 → 祖先链最高祖先（着色根，不需要在视图中）
        var colorRoot = {};
        renderNodes.forEach(function(n) {
          var key = n.id, pid = _parentCommId(n.id);
          while (pid !== null) { key = pid; pid = _parentCommId(pid); }
          colorRoot[n.id] = key;
        });
        // 着色根 ID → 稳定色相（哈希 + 黄金比例混洗）
        var rootHue = {};
        for (var rk in colorRoot) rootHue[colorRoot[rk]] = _stableHue(colorRoot[rk]);
        // 着色
        g_cy.nodes().forEach(function(n) {
          if (n.data('isExternal')) return;
          var nid = n.id();
          var rid = colorRoot[nid];
          if (!rid) { n.style('background-color', '#999'); return; }
          // 计算 depth：从节点沿祖先链到着色根的步数
          var cd = 0;
          for (var cur = nid; cur !== rid;) { var p = _parentCommId(cur); if (p === null) break; cur = p; cd++; }
          n.style('background-color', _hueSatLight(cd, rootHue[rid]));
        });
        // 日志：输出所有节点 ID、着色根 ID、色相、depth、色值
        var logLines = [];
        g_cy.nodes().forEach(function(n) {
          if (n.data('isExternal')) return;
          var nid = n.id(), rid = colorRoot[nid], hue = rootHue[rid], cd = 0;
          for (var cur = nid; cur !== rid;) { var p = _parentCommId(cur); if (p === null) break; cur = p; cd++; }
          logLines.push(nid + '\troot=' + (rid || '-') + '\thue=' + (hue != null ? hue : '-') + '\tdepth=' + cd + '\tcolor=' + (rid ? _hueSatLight(cd, hue) : '#999'));
        });
        console.log('[COLOR] nodeCount=' + logLines.length + '\n' + logLines.join('\n'));
      } else {
        // 外部节点：按被引用热度三档着色
        GraphView._applyExternalHeat();
      }
      var titleEl = document.getElementById('graphToolbarTitle');
      if (titleEl) titleEl.textContent = '\u56fe\u64cd\u4f5c\uff08' + g_cy.nodes().length + ' \u8282\u70b9 / ' + g_cy.edges().length + ' \u8fb9\uff09';

      // 动态 numIter + 加载超时保护
      var totalNodes = g_cy.nodes().length;
      var numIter = 4000;
      if (totalNodes > 500) numIter = 300;
      else if (totalNodes > 100) numIter = 1000;

      // loadingEl / errorEl 是静态 HTML 中预定义的元素
      var loadingEl = document.getElementById('graphLoading');
      var loadingText = loadingEl ? loadingEl.querySelector('#graphLoadingText') : null;
      if (loadingEl && loadingText) {
        console.log('[G-load] showing loading overlay for ' + totalNodes + ' nodes');
        loadingText.textContent = '\u6b63\u5728\u8ba1\u7b97\u5e03\u5c40 (' + totalNodes + ' \u8282\u70b9)...';
        loadingEl.style.display = 'flex';
        // 延迟启动布局，让浏览器先渲染 loading 动画
        setTimeout(function() { runCose(); }, 50);
      } else {
        runCose();
      }

      function runCose() {
        GraphView._layoutDone = false;
      GraphView._layoutTimer = null;

      var ly = g_cy.layout({ name: 'cose', animate: false, nodeRepulsion: 8000, idealEdgeLength: 100, numIter: numIter, fit: false, nodeOverlap: 20, padding: 20 });
      ly.one('layoutstop', function() {
        GraphView._layoutDone = true;
        if (GraphView._layoutTimer) { clearTimeout(GraphView._layoutTimer); GraphView._layoutTimer = null; }
        if (loadingEl) loadingEl.style.display = 'none';
        g_cy.zoom(1.0);
        var conn = g_cy.nodes().filter(function(n) { return n.degree(false) > 0; });
        if (!conn.empty()) g_cy.center(conn); else g_cy.center();
        GraphView._loadLayout().then(function(saved) {
          if (!g_cy) return;
          if (!saved) {
            var nds = {};
            g_cy.nodes().forEach(function(n) {
              var p = n.position();
              nds[n.id()] = {x: Math.round(p.x*10)/10, y: Math.round(p.y*10)/10};
            });
            API.graphLayoutSave(S.taskId, S.cid||'', S.et, S.gran||'component', S.depth||1, nds).catch(function(){});
          }
          var cn2 = g_cy.nodes().filter(function(n) { return n.degree(false) > 0; });
          if (!cn2.empty()) g_cy.center(cn2); else g_cy.center();
        });
      });
      ly.run();

      // 超时检测
      GraphView._layoutTimer = setTimeout(function() {
          if (!GraphView._layoutDone) {
            if (loadingEl) loadingEl.style.display = 'none';
            var errEl = document.getElementById('graphError');
            var msgEl = document.getElementById('graphErrorMsg');
            if (errEl && msgEl) {
              msgEl.textContent = '\u8282\u70b9\u8fc7\u591a\uff08' + totalNodes + '\uff09\uff0c\u5e03\u5c40\u8ba1\u7b97\u8d85\u65f6\uff08' + (S.layoutTimeout / 1000) + '\u79d2\uff09\u3002\u8bf7\u7f29\u5c0f\u67e5\u8be2\u8303\u56f4\u6216\u964d\u4f4e\u6df1\u5ea6\uff0c\u6216\u5728\u53f3\u4fa7\u9762\u677f\u4e2d\u589e\u5927\u8d85\u65f6\u8bbe\u7f6e\u3002';
              errEl.style.display = 'flex';
            }
          }
        }, S.layoutTimeout || 60000);
      }

      // Dragfree → save positions (debounced)
      GraphView._saveTimer = null;

      // Double-click node: drill down
      g_cy.on('dblclick', 'node', function(evt) {
        var nodeId = evt.target.id();
        var extNode = evt.target.data('isExternal');
        var hc = evt.target.data('hasChildren');
        console.log('[dbclick] nodeId=' + nodeId.slice(0,30) + ' isExternal=' + extNode + ' hasChildren=' + hc + ' S.cid=' + S.cid + ' S.gran=' + S.gran + ' isComp=' + isComponent);
        if (isExternal) {
          if (!extNode && nodeId !== S.cid) {
            S.commParent = nodeId;
            if (S.commStack.length === 0) _rootEntryEt = S.et;
            S.commStack.push({cid: nodeId, name: evt.target.data('label'), et: S.et});
            StateStore.commit({cid: nodeId, depth: 1});
          }
        } else if (isComponent) {
          if (nodeId === S.cid) return;
          S.commParent = nodeId;
          if (S.commStack.length === 0) _rootEntryEt = S.et;
          S.commStack.push({cid: nodeId, name: evt.target.data('label'), et: S.et});
          if (evt.target.data('hasChildren') === false) {
            StateStore.commit({cid: nodeId, depth: 1, gran: 'file'});
          } else {
            StateStore.commit({cid: nodeId, depth: 1});
          }
        }
        RightPanel.renderPanel();
        RightPanel.loadViz();
      });

      // Double-click background: noop (avoid accidental navigation)
      g_cy.on('dblclick', function(evt) {
        if (evt.target === g_cy) {
          if (g_cy) g_cy.fit(undefined, 50);
        }
      });

      // Dragfree → auto-save positions (debounced)
      g_cy.on('dragfree', 'node', function() {
        if (GraphView._saveTimer) clearTimeout(GraphView._saveTimer);
        GraphView._saveTimer = setTimeout(function() {
          var nds = {};
          g_cy.nodes().forEach(function(n) {
            var p = n.position();
            nds[n.id()] = {x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10};
          });
          API.graphLayoutSave(S.taskId, S.cid || '', S.et, S.gran || 'component', S.depth || 1, nds).catch(function(e) {
            console.warn('save layout error:', e);
          });
        }, 1000);
      });

      // ---- graph toolbar ----
      GraphView._initToolbar();
      GraphView._initContextMenu();

      // Error dismiss handlers
      var errDismiss = document.getElementById('graphErrorDismiss');
      var errClose = document.getElementById('graphErrorClose');
      function hideGError() { var e = document.getElementById('graphError'); if (e) e.style.display = 'none'; }
      if (errDismiss) errDismiss.onclick = hideGError;
      if (errClose) errClose.onclick = hideGError;

    } catch(e) {
      cyContainer.innerHTML = '<div class="error-msg">\u52a0\u8f7d\u5173\u7cfb\u56fe\u5931\u8d25: ' + e.message + '</div>';
    }
  },
  _initToolbar() {
    var tb = document.getElementById('graphToolbar');
    var hdr = document.getElementById('graphToolbarHeader');
    var fp = document.getElementById('graphFilterPanel');
    if (!tb || !hdr) return;

    console.log('[Tb] _initToolbar START', {tb: !!tb, hdr: !!hdr, fp: !!fp});
    // 阻止工具栏点击冒泡到画布
    tb.onmousedown = function(e) { console.log('[Tb] tb.mousedown target=' + e.target.id + ' tag=' + e.target.tagName); e.stopPropagation(); };
    tb.onclick = function(e) { console.log('[Tb] tb.click target=' + e.target.id + ' tag=' + e.target.tagName + ' btn=' + e.target.closest('button')?.id); e.stopPropagation(); };

    // --- collapse ---
    var collapseBtn = document.getElementById('graphToolbarCollapse');
    collapseBtn.onclick = function(e) {
      console.log('[Tb] collapseBtn.click');
      e.stopPropagation();
      tb.classList.toggle('collapsed');
      this.textContent = tb.classList.contains('collapsed') ? '+' : '\u2212';
    };

    // --- drag ---
    var dragOn = false, sx = 0, sy = 0, ox = 0, oy = 0;
    hdr.onmousedown = function(e) {
      if (e.target.closest('button')) return;
      e.stopPropagation();
      e.preventDefault();
      dragOn = true; sx = e.clientX; sy = e.clientY;
      var pr = tb.parentElement.getBoundingClientRect();
      var r = tb.getBoundingClientRect();
      ox = r.left - pr.left; oy = r.top - pr.top;
    };
    document.addEventListener('mousemove', function(e) {
      if (!dragOn) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
      tb.style.left = (ox + dx) + 'px';
      tb.style.top = (oy + dy) + 'px';
      tb.style.transform = 'none';
    });
    document.addEventListener('mouseup', function() { dragOn = false; });

    // --- filter panel drag (仅 header 可拖) ---
    var fpHdr = fp.querySelector('.graph-filter-header');
    var fpDragOn = false, fpSx = 0, fpSy = 0, fpOx = 0, fpOy = 0;
    // 阻止面板点击冒泡到画布
    fp.onmousedown = function(e) { e.stopPropagation(); };
    if (fpHdr) fpHdr.onmousedown = function(e) {
      if (!fp.classList.contains('open')) return;
      if (e.target.closest('button') || e.target.closest('input')) return;
      e.stopPropagation();
      e.preventDefault();
      fpDragOn = true; fpSx = e.clientX; fpSy = e.clientY;
      var pr = fp.parentElement.getBoundingClientRect();
      var r = fp.getBoundingClientRect();
      fpOx = r.left - pr.left; fpOy = r.top - pr.top;
      fp.style.opacity = '1';
    };
    document.addEventListener('mousemove', function(e) {
      if (!fpDragOn) return;
      var dx = e.clientX - fpSx, dy = e.clientY - fpSy;
      if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
      fp.style.left = (fpOx + dx) + 'px';
      fp.style.top = (fpOy + dy) + 'px';
      fp.style.right = 'auto';
    });
    document.addEventListener('mouseup', function() {
      if (fpDragOn) { fpDragOn = false; fp.style.opacity = ''; }
    });

    // --- 跟随 (linked) / 独立 (locked) 模式 (按钮切换) ---
    var btnMode = document.getElementById('graphTbMode');
    btnMode.onclick = function(e) {
      console.log('[Tb] btnMode.click locked=' + btnMode.classList.contains('active'));
      e.stopPropagation();
      var locked = btnMode.classList.contains('active');
      if (locked) {
        btnMode.classList.remove('active');
        btnMode.textContent = '\u72ec\u7acb';
        btnMode.title = '\u72ec\u7acb\u6a21\u5f0f\uff1a\u62d6\u62fd\u8282\u70b9\u65f6\u5176\u5b83\u8282\u70b9\u9501\u5b9a\uff08\u70b9\u51fb\u5207\u6362\u4e3a\u968f\u4ece\u6a21\u5f0f\uff09';
      } else {
        btnMode.classList.add('active');
        btnMode.textContent = '\u968f\u4ece';
        btnMode.title = '\u968f\u4ece\u6a21\u5f0f\uff1a\u62d6\u62fd\u8282\u70b9\u65f6\u5173\u8054\u8282\u70b9\u968f\u4ece\u79fb\u52a8\uff08\u70b9\u51fb\u5207\u6362\u4e3a\u72ec\u7acb\u6a21\u5f0f\uff09';
      }
    };

    function _isLocked() { return !btnMode.classList.contains('active'); }

    // ---- Cytoscape 实例相关（g_cy 可能为 null） ----
    if (g_cy) {
      // grab: locked 模式 — 锁定其它节点
      g_cy.on('grab', 'node', function(evt) {
        if (_isLocked()) {
          var grabbed = evt.target;
          g_cy.nodes().forEach(function(n) { if (!n.same(grabbed)) n.lock(); });
        }
      });
      g_cy.on('free', 'node', function() {
        if (_isLocked() && g_cy) g_cy.nodes().unlock();
      });
      // drag → linked 模式: 关联节点跟随
      var dragPrevPos = null;
      g_cy.on('drag', 'node', function(evt) {
        if (_isLocked()) return;
        var node = evt.target;
        var pos = node.position();
        if (!dragPrevPos) { dragPrevPos = { x: pos.x, y: pos.y }; return; }
        var dx = pos.x - dragPrevPos.x;
        var dy = pos.y - dragPrevPos.y;
        if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
        dragPrevPos = { x: pos.x, y: pos.y };
        var neighbors = node.closedNeighborhood().nodes().filter(function(n) { return !n.same(node); });
        if (neighbors.length > 0) {
          console.log('[Viewer-drag] grabbed=' + node.id() + ' pos=(' + pos.x.toFixed(1) + ',' + pos.y.toFixed(1) + ') dx=' + dx.toFixed(1) + ' dy=' + dy.toFixed(1) + ' neighbours=' + neighbors.length);
        }
        neighbors.forEach(function(n) {
          var np = n.position();
          var nx = np.x + dx * 0.7;
          var ny = np.y + dy * 0.7;
          console.log('[Viewer-drag]   -> ' + n.id() + ' (' + np.x.toFixed(1) + ',' + np.y.toFixed(1) + ') -> (' + nx.toFixed(1) + ',' + ny.toFixed(1) + ') delta=(' + (dx * 0.7).toFixed(1) + ',' + (dy * 0.7).toFixed(1) + ')');
          n.position({ x: nx, y: ny });
        });
      });
      g_cy.on('free', 'node', function() { dragPrevPos = null; });
    }

    // --- show/hide edges ---
    var btnEdges = document.getElementById('graphTbEdges');
    if (g_cy && !btnEdges.classList.contains('active')) {
      g_cy.edges().hide();
    }
    btnEdges.onclick = function(e) {
      console.log('[Tb] btnEdges.click');
      e.stopPropagation();
      if (!g_cy) return;
      var hidden = btnEdges.classList.contains('active');
      if (hidden) {
        g_cy.edges().hide(); btnEdges.classList.remove('active');
      } else {
        g_cy.edges().show(); btnEdges.classList.add('active');
      }
    };

    // --- filter panel ---
    var btnFilter = document.getElementById('graphTbFilter');
    btnFilter.onclick = function(e) {
      console.log('[Tb] btnFilter.click');
      e.stopPropagation();
      fp.classList.toggle('open');
      if (fp.classList.contains('open')) GraphView._refreshFilter();
    };
    document.getElementById('graphFilterClose').onclick = function(e) { e.stopPropagation(); fp.classList.remove('open'); };
    document.getElementById('graphFilterSearch').oninput = function(e) { e.stopPropagation(); GraphView._refreshFilter(); };
    var toggleAllBtn = document.getElementById('graphFilterToggleAll');
    toggleAllBtn.onclick = function() {
      if (!g_cy) return;
      var total = g_cy.nodes();
      // 中心模式下只操作可见节点，不影响其他节点的手动状态
      var candidates = S.centerNodes.length > 0
        ? total.filter(function(n) { return !n.hidden(); })
        : total;
      var hidden = candidates.filter(function(n) { return n.hidden(); });
      if (hidden.length === 0) {
        var isolated = candidates.filter(function(n) { return n.degree(false) === 0; });
        if (isolated.length > 0) {
          isolated.hide();
          isolated.forEach(function(n) { _manualHidden.add(n.id()); });
          this.textContent = '\u9690\u85cf\u5168\u90e8';
          this.title = '\u9690\u85cf\u6240\u6709\u8282\u70b9';
        }
      } else {
        var hasNonIsoHidden = candidates.some(function(n) { return n.hidden() && n.degree(false) > 0; });
        if (!hasNonIsoHidden) {
          candidates.hide();
          candidates.forEach(function(n) { _manualHidden.add(n.id()); });
          this.textContent = '\u663e\u793a\u5168\u90e8';
          this.title = '\u663e\u793a\u6240\u6709\u8282\u70b9';
        } else {
          total.show();
          _manualHidden.clear();
          _manualShown.clear();
          this.textContent = '\u9690\u85cf\u5b64\u7acb';
          this.title = '\u9690\u85cf\u5b64\u7acb\u8282\u70b9\uff08\u65e0\u8fde\u7ebf\uff09';
        }
      }
      if (S.centerNodes.length > 0) {
        applyCenterMode();
      }
      GraphView._refreshFilter();
    };

    // reset positions & clear filters button
    var resetBtn = document.getElementById('graphTbReset');
    if (resetBtn) resetBtn.onclick = function(e) {
      console.log('[Tb] resetBtn.click');
      e.stopPropagation();
      if (!g_cy || !S.taskId) return;
      S.centerNodes = [];
      _manualHidden.clear();
      _manualShown.clear();
      g_cy.nodes().show();
      API.graphLayoutDelete(S.taskId, S.cid || '', S.et, S.gran || 'component', S.depth || 1).catch(function() {});
      var ly = g_cy.layout({ name: 'cose', animate: false, nodeRepulsion: 8000, idealEdgeLength: 100, numIter: 4000, fit: false, nodeOverlap: 20, padding: 20 });
      ly.run();
      g_cy.resize();
      var conn = g_cy.nodes().filter(function(n) { return n.degree(false) > 0; });
      if (!conn.empty()) g_cy.center(conn); else g_cy.center();
      var toggleBtn = document.getElementById('graphFilterToggleAll');
      if (toggleBtn) {
        toggleBtn.textContent = '\u9690\u85cf\u5b64\u7acb';
        toggleBtn.title = '\u9690\u85cf\u5b64\u7acb\u8282\u70b9\uff08\u65e0\u8fde\u7ebf\uff09';
      }
      GraphView._refreshFilter();
    };

    // --- 组件/文件形态切换按钮 ---
    var btnGran = document.getElementById('graphTbGran');
    if (btnGran) {
      function _updateGranBtn() {
        if (S.gran === 'file') {
          btnGran.classList.add('active');
          btnGran.textContent = '\u6587\u4ef6\u5f62\u6001';
          btnGran.title = '\u5f53\u524d\u4e3a\u6587\u4ef6\u5f62\u6001\uff0c\u70b9\u51fb\u5207\u6362\u4e3a\u7ec4\u4ef6\u5f62\u6001';
        } else {
          btnGran.classList.remove('active');
          btnGran.textContent = '\u7ec4\u4ef6\u5f62\u6001';
          btnGran.title = '\u5f53\u524d\u4e3a\u7ec4\u4ef6\u5f62\u6001\uff0c\u70b9\u51fb\u5207\u6362\u4e3a\u6587\u4ef6\u5f62\u6001';
        }
      }
      _updateGranBtn();
      btnGran.onclick = function(e) {
        console.log('[Tb] btnGran.click');
        e.stopPropagation();
        if (S.gran === 'component') {
          S.gran = 'file';
          if (S.et === 'EXTERNAL_INCLUDE' || S.et === 'EXTERNAL_CALL') {
            S.et = S.et === 'EXTERNAL_INCLUDE' ? 'INCLUDE' : 'CALL';
          }

        }

        _updateGranBtn();

      };

    // --- 关系图/热力图切换按钮 ---
    var btnTab = document.getElementById('graphTbTab');
    if (btnTab) {
      function _updateTabBtn() {
        if (S.tab === 'heatmap') {
          btnTab.classList.add('active');
          btnTab.textContent = '\u70ed\u529b\u56fe';
          btnTab.title = '\u5f53\u524d\u4e3a\u70ed\u529b\u56fe\uff0c\u70b9\u51fb\u5207\u6362\u4e3a\u5173\u7cfb\u56fe';
        } else {
          btnTab.classList.add('active');
          btnTab.textContent = '\u5173\u7cfb\u56fe';
          btnTab.title = '\u5f53\u524d\u4e3a\u5173\u7cfb\u56fe\uff0c\u70b9\u51fb\u5207\u6362\u4e3a\u70ed\u529b\u56fe';
        }
      }
      _updateTabBtn();
      btnTab.onclick = function(e) {
        console.log('[Tb] btnTab.click');
        e.stopPropagation();
        var newTab = S.tab === 'graph' ? 'heatmap' : 'graph';
        RightPanel.switchTab(newTab);
        _updateTabBtn();
      };
    }
    console.log('[Tb] _initToolbar DONE g_cy=' + !!g_cy);
  },
  _refreshFilter() {
    var list = document.getElementById('graphFilterList');
    var q = (document.getElementById('graphFilterSearch').value || '').trim().toLowerCase();
    if (!g_cy || !list) return;
    // sync toggle button text with current state
    var tb = document.getElementById('graphFilterToggleAll');
    if (tb) {
      var hidden = g_cy.nodes(':hidden');
      if (hidden.length === 0) {
        tb.textContent = '\u9690\u85cf\u5b64\u7acb';
        tb.title = '\u9690\u85cf\u5b64\u7acb\u8282\u70b9\uff08\u65e0\u8fde\u7ebf\uff09';
      } else {
        var hasNonIso = g_cy.nodes().some(function(n) { return n.hidden() && n.degree(false) > 0; });
        tb.textContent = hasNonIso ? '\u663e\u793a\u5168\u90e8' : '\u9690\u85cf\u5168\u90e8';
        tb.title = hasNonIso ? '\u663e\u793a\u6240\u6709\u8282\u70b9' : '\u9690\u85cf\u6240\u6709\u8282\u70b9';
      }
    }
    var nodes = g_cy.nodes();
    var h = '';
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var label = n.data('label') || n.id();
      var hidden = n.hidden();
      if (q && label.toLowerCase().indexOf(q) < 0 ) continue;
      var color = n.style('background-color') || '#999';
      h += '<div class="graph-filter-item' + (hidden ? ' hidden' : '') + '" data-nid="' + n.id() + '">';
      h += '<span class="dot" style="background:' + color + '"></span>';
      h += '<span class="name">' + escapeHtml(label) + '</span>';
      h += '</div>';
    }
    if (!h) h = '<div style="color:var(--text-muted);padding:8px">\u65e0\u5339\u914d\u8282\u70b9</div>';
    list.innerHTML = h;
    var self = this;
    list.querySelectorAll('.graph-filter-item').forEach(function(item) {
      item.onclick = function() {
        var nid = this.dataset.nid;
        var node = g_cy.getElementById(nid);
        if (node.length) {
          if (node.hidden()) {
            node.show();
            _manualHidden.delete(nid);
            _manualShown.add(nid);
          } else {
            node.hide();
            _manualHidden.add(nid);
            _manualShown.delete(nid);
          }
          self._refreshFilter();
        }
      };
    });
  },
  _initContextMenu() {
    var menu = document.getElementById('graphContextMenu');
    if (!menu || !g_cy) return;

    g_cy.on('cxttap', 'node', function(evt) {
      var oe = evt.originalEvent;
      if (oe) oe.preventDefault();
      var node = evt.target;
      var nodeId = node.id();
      var isExternal = node.data('isExternal');

      var drillItem = menu.querySelector('[data-action="drilldown"]');
      var docItem = menu.querySelector('[data-action="doc"]');
      var centerItem = menu.querySelector('[data-action="center-view"]');

      if (!isExternal && nodeId !== S.cid && node.data('hasChildren') !== false) {
        drillItem.style.display = '';
      } else {
        drillItem.style.display = 'none';
      }

      var isCenter = S.centerNodes.indexOf(nodeId) >= 0;
      centerItem.querySelector('span').textContent = isCenter ? '\u53D6\u6D88\u4E2D\u5FC3' : '\u4E2D\u5FC3\u89C6\u56FE';

      menu._ctxNodeId = nodeId;
      menu._ctxIsExt = !!isExternal;

      var mx = oe ? oe.clientX : 0;
      var my = oe ? oe.clientY : 0;
      var mw = menu.offsetWidth || 130;
      var mh = menu.offsetHeight || 60;
      if (mx + mw > window.innerWidth) mx = window.innerWidth - mw - 4;
      if (my + mh > window.innerHeight) my = window.innerHeight - mh - 4;
      menu.style.left = Math.max(0, mx) + 'px';
      menu.style.top = Math.max(0, my) + 'px';
      menu.style.display = 'block';
    });

    document.addEventListener('click', function(e) {
      if (!menu.contains(e.target)) menu.style.display = 'none';
    });
    if (g_cy) g_cy.on('tap', function() { menu.style.display = 'none'; });

    menu.querySelector('[data-action="copy-node"]').onclick = function() {
      var nid = menu._ctxNodeId;
      if (!nid || !g_cy) return;
      menu.style.display = 'none';
      var node = g_cy.getElementById(nid);
      if (!node.length) return;
      var label = node.data('label') || nid;
      var info = {
        projectId: S.projectId || '',
        projectName: S.projectName || '',
        taskId: S.taskId || '',
        nodeId: nid,
        nodeName: label
      };
      var text = JSON.stringify(info, null, 2);
      try { navigator.clipboard.writeText(text); } catch(e) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      showToast(__('viewer.copiedInfo'));
    };

    menu.querySelector('[data-action="drilldown"]').onclick = function() {
      var nid = menu._ctxNodeId;
      if (!nid || !g_cy) return;
      menu.style.display = 'none';
      var node = g_cy.getElementById(nid);
      if (!node.length) return;
      var label = node.data('label') || nid;
      console.log('[ctx-drill] nid=' + nid + ' label=' + label.slice(0,20) + ' S.gran=' + S.gran + ' S.cid=' + S.cid + ' hasChildren=' + node.data('hasChildren'));
      if (nid === S.cid) return;
      // File mode: no drill-down
      if (S.gran === 'file') return;
      S.commParent = nid;
      if (S.commStack.length === 0) _rootEntryEt = S.et;
      S.commStack.push({cid: nid, name: label, et: S.et});
      // Leaf community → show file-level deps/calls
      if (node.data('hasChildren') === false) {
        StateStore.commit({cid: nid, depth: 1, gran: 'file'});
      } else {
        StateStore.commit({cid: nid, depth: 1});
      }
      RightPanel.renderPanel();
      RightPanel.loadViz();
    };

    menu.querySelector('[data-action="doc"]').onclick = function() {
      var nid = menu._ctxNodeId;
      if (!nid || !g_cy || !S.taskId) return;
      menu.style.display = 'none';
      var node = g_cy.getElementById(nid);
      if (!node.length) return;
      var commId = nid;
      var et = (commId.indexOf('-incl-') >= 0) ? 'INCLUDE' :
               (commId.indexOf('-call-') >= 0) ? 'CALL' :
               (S.docEt || 'INCLUDE');
      var label = node.data('label') || commId;
      console.log('[ctx-doc] nid=' + nid + ' label=' + label.slice(0,20) + ' et=' + et + ' S.commStack=' + S.commStack.length);
      // Build parent chain
      var curPc = S.pc || '';
      var curCid = S.docCommId || '';
      var curCn = S.cn || '';
      var chain = [];
      if (curPc) chain.push(curPc);
      if (curCid && curCn && curCid !== commId) chain.push(curCn + '|' + curCid + '|' + S.docEt);
      var pcStr = chain.join(',');
      StateStore.commit({docCommId: commId, cn: label, pc: pcStr, docEt: et});
      loadCommunityDoc(S.taskId, commId, et, true);
    };

    menu.querySelector('[data-action="center-view"]').onclick = function() {
      var nid = menu._ctxNodeId;
      if (!nid || !g_cy) return;
      menu.style.display = 'none';
      var idx = S.centerNodes.indexOf(nid);
      if (idx >= 0) {
        S.centerNodes.splice(idx, 1);
      } else {
        S.centerNodes.push(nid);
      }
      applyCenterMode();
    };
  },

  async _loadLayout() {
    if (!g_cy || !S.taskId) return false;
    try {
      var data = await API.graphLayoutLoad(S.taskId, S.cid || '', S.et, S.gran || 'component', S.depth || 1);
      if (data.found && data.nodes) {
        g_cy.nodes().forEach(function(n) {
          var pos = data.nodes[n.id()];
          if (pos) n.position({x: pos.x, y: pos.y});
        });
        return true;
      }
      return false;
    } catch(e) { return false; }
  },

  _applyExternalHeat() {
    if (!g_cy) return;
    var extNodes = g_cy.nodes('[isExternal]');
    console.log('[ext-heat] extNodes=' + extNodes.length + ' total=' + g_cy.nodes().length);
    if (extNodes.length < 2) return;
    var degs = [];
    extNodes.forEach(function(n) { degs.push({id:n.id(), deg:n.degree(false)}); });
    degs.sort(function(a,b){return b.deg-a.deg;});
    var top30 = Math.ceil(degs.length * 0.3);
    var mid60 = Math.ceil(degs.length * 0.6);
    degs.forEach(function(item, idx) {
      try {
        var c = idx < top30 ? '#f59e0b' : idx < mid60 ? '#fbbf24' : '#fde68a';
        var node = g_cy.getElementById(item.id);
        if (node.length) node.style('background-color', c);
      } catch(e) { console.error('[ext-heat] error id=' + item.id + ' msg=' + e.message); }
    });
  },
};

// ---- 6g. HeatmapView ----
const HeatmapView = {
  cellColor(v, maxC) {
    if (v === 0) return 'transparent';
    var i = Math.min(v / maxC, 1);
    return 'rgb(255,' + Math.round(245 - 200 * i) + ',' + Math.round(245 - 200 * i) + ')';
  },

  async load() {
    var size = parseInt(document.getElementById('heatmapSize').value) || S.size;
    S.size = size;
    var container = document.getElementById('heatmapContent');
    var cid = S.cid || '';
    try {
      var isExternal = S.et === 'EXTERNAL_INCLUDE' || S.et === 'EXTERNAL_CALL';
      if (isExternal) {
        var ext = await API.externalStats(S.taskId);
        var items = S.et === 'EXTERNAL_INCLUDE' ? (ext.externalDeps || []) : (ext.externalCalls || []);
        if (cid) {
          // drill: 过滤到该社区相关的外部项，列=子社区
          var children = await API.communityChildren(S.taskId, cid, S.et);
          var childIds = {};
          for (var ci = 0; ci < children.length; ci++) childIds[children[ci].commId] = children[ci].name || children[ci].commId;
          items = [];
          for (var ii = 0; ii < ext.allItems ? 0 : 0; ii++) {/*placeholder*/}
          // filter
          for (var ii2 = 0; ii2 < (S.et === 'EXTERNAL_INCLUDE' ? ext.externalDeps : ext.externalCalls || []).length; ii2++) {
            var fullItem = (S.et === 'EXTERNAL_INCLUDE' ? ext.externalDeps : ext.externalCalls || [])[ii2];
            var comms = fullItem.communities || [];
            for (var ji = 0; ji < comms.length; ji++) {
              if (comms[ji].communityId === cid) { items.push(fullItem); break; }
            }
          }
          if (items.length === 0 || children.length === 0) {
            container.innerHTML = '<div class="loading">\u6682\u65e0\u6570\u636e</div>';
            return;
          }
          // Build matrix: rows=items, cols=children
          var colIds = Object.keys(childIds);
          var cols = colIds.map(function(k) { return childIds[k]; });
          var rows = [];
          var matrix = [];
          var maxC = 0;
          for (var ii3 = 0; ii3 < items.length && ii3 < size; ii3++) {
            var item = items[ii3];
            rows.push(item.package || item.name);
            var row = [];
            var itemCommSet = {};
            (item.communities || []).forEach(function(c2) { itemCommSet[c2.communityId] = item.fileCount || item.count || 1; });
            for (var ji2 = 0; ji2 < colIds.length; ji2++) {
              var v = itemCommSet[colIds[ji2]] || 0;
              row.push(v);
              if (v > maxC) maxC = v;
            }
            matrix.push(row);
          }
          var h2 = this._renderTable(rows, cols, matrix, maxC, colIds);
          container.innerHTML = h2;
          this._attachDrillHandlers(container, colIds);
          return;
        }
        // global external heatmap (unchanged)
        if (items.length === 0) {
          container.innerHTML = '<div class="loading">\u6682\u65e0\u6570\u636e</div>';
          return;
        }
        var commMap = {};
        var itemList = items.slice(0, size);
        for (var ii4 = 0; ii4 < itemList.length; ii4++) {
          var itemA = itemList[ii4];
          (itemA.communities || []).forEach(function(c) {
            if (!commMap[c.communityId]) commMap[c.communityId] = c.name || c.communityId;
          });
        }
        var commKeys = Object.keys(commMap);
        var colsG = commKeys.map(function(k) { return commMap[k]; });
        var rowsG = [];
        var matrixG = [];
        var maxCG = 0;
        for (var ii5 = 0; ii5 < itemList.length; ii5++) {
          var itemB = itemList[ii5];
          rowsG.push(itemB.package || itemB.name);
          var rowG = [];
          var itemCommSetG = {};
          (itemB.communities || []).forEach(function(c2) { itemCommSetG[c2.communityId] = itemB.fileCount || itemB.count || 1; });
          for (var ji3 = 0; ji3 < commKeys.length; ji3++) {
            var vG = itemCommSetG[commKeys[ji3]] || 0;
            rowG.push(vG);
            if (vG > maxCG) maxCG = vG;
          }
          matrixG.push(rowG);
        }
        container.innerHTML = this._renderTable(rowsG, colsG, matrixG, maxCG, commKeys);
        this._attachDrillHandlers(container, commKeys);
        return;
      }
      // Internal heatmap
      var data = await API.heatmap(S.taskId, S.et, size, cid);
      if (!data.rows || data.rows.length === 0) {
        container.innerHTML = '<div class="loading">\u6682\u65e0\u6570\u636e</div>';
        return;
      }
      // Client-side trim: respect the requested size
      if (data.rows.length > size || (data.cols && data.cols.length > size)) {
        var n = size;
        data.rows = data.rows.slice(0, n);
        if (data.cols) data.cols = data.cols.slice(0, n);
        if (data.commIds) data.commIds = data.commIds.slice(0, n);
        if (data.matrix) {
          data.matrix = data.matrix.slice(0, n);
          for (var ti = 0; ti < data.matrix.length; ti++) {
            if (data.matrix[ti] && data.matrix[ti].length > n) data.matrix[ti] = data.matrix[ti].slice(0, n);
          }
        }
      }
      // Sort by heat: highest total row first (top-left)
      this._sortByHeat(data);
      var maxC = data.maxCount || 1;
      var html = this._renderTable(data.rows, data.cols, data.matrix, maxC, data.commIds || data.rows);
      container.innerHTML = html;
      container.style.paddingTop = Math.round(container.offsetHeight * 0.25) + 'px';
      this._attachDrillHandlers(container, data.commIds || []);
    } catch(e) {
      container.innerHTML = '<div class="error-msg">\u52a0\u8f7d\u70ed\u529b\u56fe\u5931\u8d25: ' + e.message + '</div>';
    }
  },

  _sortByHeat(data) {
    if (!data.matrix || !data.rows) return;
    var n = data.rows.length;
    // Row totals (sum across columns)
    var rowTotals = [];
    for (var ri = 0; ri < n; ri++) {
      var s = 0;
      for (var ci = 0; ci < (data.matrix[ri] || []).length; ci++) s += data.matrix[ri][ci] || 0;
      rowTotals.push(s);
    }
    // Column totals (sum across rows)
    var colTotals = [];
    var m = data.cols ? data.cols.length : (data.matrix[0] ? data.matrix[0].length : 0);
    for (var ci = 0; ci < m; ci++) {
      var s = 0;
      for (var ri = 0; ri < n; ri++) s += (data.matrix[ri] || [])[ci] || 0;
      colTotals.push(s);
    }
    // Sort row indices by total descending
    var rowIdx = rowTotals.map(function(_, i) { return i; }).sort(function(a, b) { return rowTotals[b] - rowTotals[a]; });
    // Sort column indices by total descending
    var colIdx = colTotals.map(function(_, i) { return i; }).sort(function(a, b) { return colTotals[b] - colTotals[a]; });
    // Reorder rows, cols, commIds, matrix
    data.rows = rowIdx.map(function(i) { return data.rows[i]; });
    if (data.cols) data.cols = colIdx.map(function(i) { return data.cols[i]; });
    if (data.commIds) data.commIds = rowIdx.map(function(i) { return data.commIds[i]; });
    var newMatrix = [];
    for (var ri = 0; ri < n; ri++) {
      var oldRow = data.matrix[rowIdx[ri]] || [];
      var newRow = [];
      for (var ci = 0; ci < m; ci++) newRow.push(oldRow[colIdx[ci]] || 0);
      newMatrix.push(newRow);
    }
    data.matrix = newMatrix;
  },

  _renderTable(rows, cols, matrix, maxC, commIds) {
    var h = '<table><thead><tr><th></th>';
    for (var ci = 0; ci < cols.length; ci++) {
      var cid = commIds && commIds[ci] ? commIds[ci] : '';
      h += '<th class="hm-col-hdr" data-cid="' + escapeAttr(cid) + '" title="' + escapeAttr(cols[ci]) + '">' + escapeHtml(cols[ci].slice(0, 8)) + '</th>';
    }
    h += '</tr></thead><tbody>';
    for (var ri = 0; ri < rows.length; ri++) {
      var rid = commIds && commIds[ri] ? commIds[ri] : '';
      h += '<tr><th class="hm-row-hdr" data-cid="' + escapeAttr(rid) + '" title="' + escapeAttr(rows[ri]) + '">' + escapeHtml(rows[ri].slice(0, 16)) + '</th>';
      for (ci = 0; ci < cols.length; ci++) {
        var v = matrix[ri] ? matrix[ri][ci] || 0 : 0;
        h += '<td style="background:' + HeatmapView.cellColor(v, maxC) + '" title="' + escapeAttr(rows[ri]) + ' \u2192 ' + escapeAttr(cols[ci]) + ': ' + v + '">' + (v || '') + '</td>';
      }
      h += '</tr>';
    }
    h += '</tbody></table>';
    return h;
  },

  _attachDrillHandlers(container, commIds) {
    var self = this;
    container.querySelectorAll('.hm-col-hdr, .hm-row-hdr').forEach(function(el) {
      el.style.cursor = 'pointer';
      el.onclick = function() {
        var cid = this.dataset.cid;
        if (!cid) return;
        S.commParent = cid;
        if (S.commStack.length === 0) _rootEntryEt = S.et;
        S.commStack.push({cid: cid, name: this.textContent, et: S.et});
        StateStore.commit({cid: cid, depth: 1});
        RightPanel.renderPanel();
        RightPanel.loadCommTree();
        RightPanel.loadViz();
        RightBreadcrumb.render();
      };
    });
  }
};

  window.__setLocale(S.locale);

  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    var text = _(key);
    if (text !== key) el.textContent = text;
  });
  document.querySelectorAll('[data-i18n-title]').forEach(function(el) {
    var key = el.getAttribute('data-i18n-title');
    var text = _(key);
    if (text !== key) el.title = text;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
    var key = el.getAttribute('data-i18n-placeholder');
    var text = _(key);
    if (text !== key) el.placeholder = text;
  });
  document.getElementById('tocToggle').title = _('viewer.subComponents');
  document.getElementById('tocToggle').onclick = function() {
    var p = document.getElementById('tocPanel');
    p.classList.toggle('open');
    this.textContent = p.classList.contains('open') ? '\u2715' : '\u2630';
    console.log('[tocToggle] open=' + p.classList.contains('open') + ' panelSize=' + p.offsetWidth + 'x' + p.offsetHeight);
    if (p.classList.contains('open')) requestAnimationFrame(function() { fitPanelPosition(document.getElementById('tocFloat')); });
  };

  // 悬浮窗鼠标移出 1.5s 自动关闭
  function _autoCloseFloat(floatId, panelId, toggleId) {
    var floatEl = document.getElementById(floatId);
    var panel = document.getElementById(panelId);
    var toggle = document.getElementById(toggleId);
    var timer = null;
    function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
    floatEl.addEventListener('mouseleave', function() {
      if (panel && panel.classList.contains('open')) {
        timer = setTimeout(function() {
          panel.classList.remove('open');
          if (toggle) toggle.textContent = '\u2630';
          if (fitPanelPosition) fitPanelPosition(floatEl);
          timer = null;
        }, 1500);
      }
    });
    floatEl.addEventListener('mouseenter', cancel);
    if (toggle) toggle.addEventListener('click', cancel);
  }
  _autoCloseFloat('tocFloat', 'tocPanel', 'tocToggle');
  _autoCloseFloat('fileCommFloat', 'fileCommPanel', 'fileCommToggle');

  Layout.init();
  makeDraggable(document.getElementById('tocFloat'), 'tocFloat', 'tocPos_v2_' + g_taskId);
  makeDraggable(document.getElementById('fileCommFloat'), 'fileCommFloat', 'commPos_v2_' + g_taskId);

  window.addEventListener('resize', function() {
    requestAnimationFrame(function() {
      fitPanelPosition(document.getElementById('tocFloat'));
      fitPanelPosition(document.getElementById('fileCommFloat'));
    });
  });

  document.getElementById('heatmapSize').onchange = function() { HeatmapView.load(); };

  // Route — docId 优先于 routeCid（总体文档覆盖社区推断路由）
  var routeCid = S.docCommId;
  if (g_communityId && g_taskId) {
    await loadCommunityDoc(g_taskId, g_communityId, g_edgeType, true);
  } else if (g_docId) {
    await loadDoc(g_docId);
  } else if (routeCid && g_taskId) {
    // 新版精简 URL：cid 参数代替 communityId
    await loadCommunityDoc(g_taskId, routeCid, S.docEt || _deriveCommEt(routeCid) || g_edgeType, true);
  } else if (!g_docId && !g_taskId) {
    document.getElementById('content').innerHTML = '<p>No document specified.</p>';
    return;
  } else if (g_taskId) {
    await loadTaskDocs(g_taskId);
  }

  // Init right panel after task is known
  if (S.taskId) {
    RightPanel.init();
    RightPanel.switchTab(S.tab);
  }
}

async function loadDoc(id) {
  var content = document.getElementById('content');
  // 如果有文件状态但无社区ID，重置
  if (S.page !== 'doc' && !g_communityId) { StateStore.commit({page: 'doc', filePath: ''}); }
  content.innerHTML = '<div class="loading">Loading document...</div>';
  // loadDoc 始终加载总体文档，无社区上下文，清空 cid/cn/pc/docCommId
  StateStore.commit({taskId: g_taskId, cn: '', pc: '', docCommId: '', cid: ''});
  try {
    var doc = await API.doc(id);
    StateStore.commit({projectId: doc.projectId || '', projectName: doc.projectName || '', taskId: doc.taskId || g_taskId, cn: doc.title || '', pc: ''});
    DocContent.render(doc.content || '');
  } catch(e) {
    content.innerHTML = '<div class="error-msg">Failed: ' + e.message + '</div>';
  }
  if (S.taskId) {
    LeftBreadcrumb.render();
    LeftToc.render('');
    Layout.apply();
  }
  // 确保 URL 包含 docId，刷新时路由走 loadDoc 而非 loadCommunityDoc
  var docUrl = new URLSearchParams(location.search);
  if (!docUrl.get('docId')) {
    docUrl.set('docId', id);
    history.replaceState(null, '', '/doc?' + docUrl.toString());
  }
}

async function loadCommunityDoc(tid, cid, et, skipCid) {
  var content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading community document...</div>';
  // 跨任务切换时清理旧上下文
  if (tid !== S.taskId) {
    StateStore.commit({cid: skipCid ? S.cid : cid, cn: '', pc: '', docCommId: cid, docEt: et, taskId: tid});
  } else {
    StateStore.commit({cid: skipCid ? S.cid : cid, docCommId: cid, docEt: et});
  }
  console.log('[loadDoc] tid=' + tid.slice(0,8) + ' cid=' + cid + ' et=' + et + ' S.docCommId=' + S.docCommId + ' S.cid=' + S.cid + ' S.docEt=' + S.docEt);

  // 如果是文件页面，直接渲染文件预摘要
  if (S.page === 'file-summary') {
    FilePreview.render(S.filePath, S.fileCommId);
    LeftBreadcrumb.render();
    LeftToc.render(cid);
    return;
  }

  try {
    var doc = await API.communityDoc(tid, cid, et);
    StateStore.commit({projectId: doc.projectId || '', projectName: doc.projectName || '', taskId: doc.taskId || tid, cn: doc.title || cid});
    DocContent.render(doc.content || '');
    LeftBreadcrumb.render();
    LeftToc.render(cid);
    // 在文档尾部插入文件列表容器
    var cd = document.getElementById('content');
    var fl = document.getElementById('fileListSection');
    if (!fl) {
      fl = document.createElement('div');
      fl.id = 'fileListSection';
      cd.appendChild(fl);
    }
    // curEt is the edgeType from URL
    var curUrl = new URLSearchParams(location.search);
    var curEt = curUrl.get('docEt') || curUrl.get('edgeType') || et || 'INCLUDE';
    FileList.load(tid, cid, curEt);
  } catch(e) {
    content.innerHTML = '<div class="error-msg">Failed: ' + e.message + '</div>';
  }
}

async function loadTaskDocs(tid) {
  document.getElementById('content').innerHTML = '<div class="loading">Loading documents...</div>';
  // 跨任务切换时清理社区上下文
  if (tid !== S.taskId) {
    StateStore.commit({taskId: tid, cid: '', cn: '', pc: ''});
  } else {
    StateStore.commit({taskId: tid});
  }
  try {
    if (g_docId) { await loadDoc(g_docId); return; }
    await loadDoc('overall-' + tid);
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="error-msg">' + e.message + '</div>';
  }
}

function showPrompt(title, defaultVal, onConfirm, onCancel) {

    '<div style="display:flex;gap:8px;justify-content:flex-end">' +

var _drafts = [];
var _draftSeq = 1;
var _draftRefSeq = 1;
var _sesCache = [];
var _execState = null; // { step, refs, userText, autoDelete, sessionId }

function loadDrafts() {
  _drafts = NotesStore.list();
  _draftSeq = (_drafts.length > 0 ? Math.max.apply(null, _drafts.map(function(d){return d.seq||0})) : 0) + 1;
  _draftRefSeq = 1;
  _drafts.forEach(function(d){(d.refs||[]).forEach(function(r){if (r.seq === undefined) r.seq = _draftRefSeq++; else if (r.seq >= _draftRefSeq) _draftRefSeq = r.seq + 1;})});
  console.log('[Notes] loadDrafts', {count: _drafts.length, seq: _draftSeq, pending: _drafts.filter(function(d){return d.status==='pending'}).length});
  return _drafts;
}
function saveDrafts() {
  try {
    NotesStore._save(_drafts);
    console.log('[Notes] saveDrafts', {count: _drafts.length});
  } catch(e) {
    console.warn('[Notes] saveDrafts ERROR', e.message);
  }
  updateDotBadge();
}
function updateDotBadge() {
  var dot = document.getElementById('notesDot');
  if (!dot) return;
  var has = _drafts.some(function(d){return d.status==='draft'||d.status==='pending'});
  dot.classList.toggle('show', has);
}

function makeRefId() { return 'ref_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function addRefToDraft(ref) {
  console.log('[Notes] addRefToDraft', {label:(ref.label||'').slice(0,40), componentId:ref.componentId, text:(ref.text||'').slice(0,30)});
  loadDrafts();
  var target = null;
  for (var i = _drafts.length - 1; i >= 0; i--) {
    if (_drafts[i].status === 'draft') { target = _drafts[i]; break; }
  }
  if (!target) {
    target = {id:'draft_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), seq:_draftSeq++, status:'draft', createdAt:new Date().toISOString(), refs:[], userText:''};
    _drafts.push(target);
    console.log('[Notes] addRefToDraft new draft', {id:target.id, seq:target.seq});
  } else {
    console.log('[Notes] addRefToDraft existing draft', {id:target.id, seq:target.seq, refsBefore:target.refs.length});
  }
  ref._id = makeRefId();
  ref.seq = _draftRefSeq++;
  target.refs.push(ref);
  saveDrafts();
  if (document.getElementById('notesDraftList')) renderDrafts();
  var btn = document.getElementById('toggleNotes');
  if (btn) { btn.classList.remove('pulse'); void btn.offsetWidth; btn.classList.add('pulse'); setTimeout(function(){btn.classList.remove('pulse')}, 1200); }
  var seqLabel = target.seq;
  showToast(__('viewer.copiedToNote') + seqLabel);
}

          '<div class="draft-meta">' +
            (r.projectName ? '<span class="ref-id">' + escHtml(r.projectName) + '</span>' : r.projectId ? '<span class="ref-id">' + escHtml(r.projectId.slice(0,12)) + '</span>' : '') +
            (r.taskId ? '<span class="ref-id '+(r.projectId||r.projectName?'muted':'')+'">' + escHtml(r.taskId.slice(0,10)) + '</span>' : '') +
            (r.componentId ? '<span class="ref-id '+(r.taskId||r.projectId||r.projectName?'muted':'')+'">' + escHtml(r.componentId.slice(0,10)) + '</span>' : '') +
            (r.label ? '<span style="font-size:11px;color:var(--text-muted);margin-left:4px">' + escHtml(r.label.slice(0,40)) + '</span>' : '') +
            copyBtn +
          '</div>' +
        '</div>' +
        '<div class="draft-body">' +
          '<textarea data-draft="'+d.id+'" data-ref="'+ri+'" placeholder="引用原文（可编辑）..." rows="1">' + escHtml(r.text||'') + '</textarea>' +
        '</div>' +
        '<div class="draft-actions">' +
          '<button class="del" data-draft="'+d.id+'" data-ref="'+ri+'">删除</button>' +
        '</div>' +
      '</div>';
    });
  });
  list.innerHTML = html;

  list.querySelectorAll('.note-draft-card textarea').forEach(function(ta) {
    ta.addEventListener('input', function() {
      var taEl = this;
      var d = _drafts.find(function(x){return x.id===taEl.dataset.draft});
      if (d && d.refs[parseInt(taEl.dataset.ref)]) d.refs[parseInt(taEl.dataset.ref)].text = taEl.value;
      saveDrafts();
      taEl.style.height='auto';taEl.style.height=Math.max(36,taEl.scrollHeight)+'px';
    });
  });
  list.querySelectorAll('.note-draft-card .del').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var btnEl = this;
      var d = _drafts.find(function(x){return x.id===btnEl.dataset.draft});
      if (d) { d.refs.splice(parseInt(btnEl.dataset.ref), 1); if (!d.refs.length) _drafts.splice(_drafts.indexOf(d), 1); }
      saveDrafts(); renderDrafts();
    });
  });
  list.querySelectorAll('.note-draft-card .cbox').forEach(function(cb) {
    cb.addEventListener('keydown', function(e) {
      if (e.key === ' ' || e.key === 'Space' || e.key === 'Enter') e.preventDefault();
    });
  });
  list.querySelectorAll('.note-draft-card .copy-id-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var text = this.dataset.copy;
      if (!text) return;
      try { navigator.clipboard.writeText(text).then(function(){ showToast(__('common.copySuccess') + ': ' + text.slice(0,20) + (text.length > 20 ? '…' : '')); }) }
      catch(e) { var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast(__('common.copySuccess')); }
    });
  });
}

// ---- 选中文本工具栏 ----

var _selBar = null;
var _selTimer = null;
document.addEventListener('selectionchange', function() {
  clearTimeout(_selTimer);
  _selTimer = setTimeout(function() {
    var sel = window.getSelection();
    var el = sel && sel.anchorNode && sel.anchorNode.parentElement;
    var inDoc = el && (el.closest('#content') || el.closest('.panel-content'));
    if (!inDoc || !sel || sel.isCollapsed || !sel.toString().trim()) {
      removeSelBar();
      return;
    }
    showSelBar(sel);
  }, 150);
});
document.addEventListener('mousedown', function(e) {
  if (_selBar && !_selBar.contains(e.target)) removeSelBar();
});
function showSelBar(sel) {
  removeSelBar();
  var text = sel.toString().trim();
  if (!text) return;
  var range = sel.getRangeAt(0);
  var rect = range.getBoundingClientRect();
  _selBar = document.createElement('div');
  _selBar.className = 'sel-toolbar';
  _selBar.innerHTML = '<button data-action="copy">复制</button><button data-action="note">存入便签</button>';
  document.body.appendChild(_selBar);
  var bw = _selBar.offsetWidth;
  var left = Math.max(4, Math.min(rect.left + (rect.width - bw) / 2, window.innerWidth - bw - 4));
  var top = rect.top - _selBar.offsetHeight - 6;
  if (top < 0) top = rect.bottom + 6;
  _selBar.style.left = left + 'px';
  _selBar.style.top = top + 'px';
  _selBar.querySelector('[data-action="copy"]').onclick = function() {
    navigator.clipboard.writeText(text).then(function(){showToast(__('common.copySuccess'));removeSelBar()}).catch(function(){showToast(__('common.copyFailed'));removeSelBar()});
  };
  _selBar.querySelector('[data-action="note"]').onclick = function() {
    var ref = getCurrentContextRef();
    if (!ref) { showToast(__('common.operationFailed')); removeSelBar(); return; }
    ref.text = text.slice(0, 2000);
    addRefToDraft(ref);
    removeSelBar();
  };
}
function removeSelBar() {
  if (_selBar) { _selBar.remove(); _selBar = null; }
}

// ---- "撕便签" 按钮（打开弹窗）----

(function() {
  var orig = window.loadCommunityDoc;
  if (orig) {
    window.loadCommunityDoc = function() {
      var p = orig.apply(this, arguments);
      if (p && p.then) {
        p.then(function() { setTimeout(addNoteButtonToDoc, 50); });
        return p;
      } else {
        setTimeout(addNoteButtonToDoc, 100);
      }
    };
  }
})();
function addNoteButtonToDoc() {
  var content = document.getElementById('content');
  if (!content) return;
  var header = content.querySelector('h1');
  if (!header) return;
  var btn = document.createElement('button');
  btn.textContent = '\uD83D\uDCCE 写便签';
  btn.style.cssText = 'margin-left:8px;padding:2px 10px;font-size:11px;border:1px solid var(--border);border-radius:4px;background:var(--bg-secondary);cursor:pointer';
  btn.onclick = function() {
    loadDrafts();
    var cid = S.cid || g_communityId || '';
    var cname = (document.querySelector('h1') ? document.querySelector('h1').textContent.trim() : '') || cid;
    openNotesModal();
    if (cid) {
      var ref = {
        projectId: S.projectId || '',
        projectName: S.projectName || '',
        taskId: S.taskId || '',
        componentId: cid,
        label: cname.slice(0, 60),
        text: '\u7EC4\u4EF6\uFF1A' + cname + '\uFF08ID: ' + cid + '\uFF09'
      };
      addRefToDraft(ref);
    }
    setTimeout(function() {
      var ut = document.getElementById('notesUserText');
      if (ut) { ut.focus(); ut.placeholder = '\u8BF7\u8F93\u5165\u5173\u4E8E\u8BE5\u7EC4\u4EF6\u7684\u5206\u6790\u9700\u6C42...'; }
    }, 100);
  };
  header.appendChild(btn);
}

// ---- Graph 右键 "存入便签" ----

document.querySelector('#graphContextMenu [data-action="note"]')?.addEventListener('click', function() {
  var menu = document.getElementById('graphContextMenu');
  var nid = menu._ctxNodeId;
  if (!nid || !S.taskId) return;
  menu.style.display = 'none';
  var node = g_cy.getElementById(nid);
  var label = node.length ? (node.data('label') || nid) : nid;
  var isExternal = !!menu._ctxIsExt;
  var ref = {
    projectId: S.projectId || '',
    projectName: S.projectName || '',
    taskId: S.taskId || '',
    componentId: nid,
    label: label.slice(0, 60)
  };
  addRefToDraft(ref);
});

// ---- 执行 / 手工 ----

function getSelectedRefs() {
  var refs = [];
  var cboxes = document.querySelectorAll('#notesDraftList .cbox:checked');
  cboxes.forEach(function(cb) {
    var d = _drafts.find(function(x){return x.id===cb.dataset.draft});
    if (d && d.refs[parseInt(cb.dataset.ref)]) refs.push(d.refs[parseInt(cb.dataset.ref)]);
  });
  return refs;
}
function removeSelectedRefs() {
  var cboxes = document.querySelectorAll('#notesDraftList .cbox:checked');
  var toRemove = [];
  cboxes.forEach(function(cb) {
    var di = _drafts.findIndex(function(x){return x.id===cb.dataset.draft});
    if (di >= 0) {
      var ri = parseInt(cb.dataset.ref);
      _drafts[di].refs.splice(ri, 1);
      if (!_drafts[di].refs.length) toRemove.push(di);
    }
  });
  toRemove.sort(function(a,b){return b-a}).forEach(function(i){_drafts.splice(i,1)});
  saveDrafts(); renderDrafts();
}

// ---- 三步执行流 ----

async function loadSessionsList() {
  try { var r = await fetch('/api/chat/sessions'); var d = await r.json(); _sesCache = d.sessions || []; } catch(e) { _sesCache = []; }
}

function _hideSessionList() {
  document.getElementById('noteSessionList').style.display = 'none';
  document.getElementById('noteSessionScroll').innerHTML = '';
}

function _resetExecBtn() {
  var btn = document.getElementById('notesBtnExec');
  btn.textContent = '立即执行';
  btn.classList.remove('btn-secondary');
  btn.classList.add('btn-primary');
}

function executeDrafts() {
  // Step 2: 确认执行
  if (_execState && _execState.step === 'confirm') {
    _doExecute();
    return;
  }
  // 选择会话阶段，按钮不响应
  if (_execState && _execState.step === 'select') {
    return;
  }

  // Step 0→1: 首次点击，校验并显示会话列表
  document.querySelectorAll('#notesDraftList textarea').forEach(function(ta){
    var d = _drafts.find(function(x){return x.id===ta.dataset.draft});
    if (d && d.refs[parseInt(ta.dataset.ref)]) d.refs[parseInt(ta.dataset.ref)].text = ta.value;
  });
  var refs = getSelectedRefs();
  if (!refs.length) { showToast('请勾选要发送的引用材料'); return; }
  var userText = document.getElementById('notesUserText').value.trim();
  if (!userText) { showToast('请输入分析需求'); return; }
  var autoDelete = document.getElementById('notesAutoDelete').checked;

  // 保存状态进入选择阶段
  _execState = { step: 'select', refs: refs, userText: userText, autoDelete: autoDelete, sessionId: null };

  // 按钮 → 选择会话（不可点击）
  var btn = document.getElementById('notesBtnExec');
  btn.textContent = '选择会话';
  btn.classList.remove('btn-primary');
  btn.classList.add('btn-secondary');

  // 显示会话列表并加载
  var container = document.getElementById('noteSessionList');
  var scroll = document.getElementById('noteSessionScroll');
  container.style.display = 'block';
  scroll.innerHTML = '<div style="padding:12px;text-align:center;color:var(--text-muted);font-size:12px">加载中...</div>';

  loadSessionsList().then(function() {
    var html = '';
    _sesCache.forEach(function(s) {
      html += '<div class="si" data-id="' + escHtml(s.id) + '">' +
        '<div class="si-title">' + escHtml((s.title || '未命名').slice(0,40)) + '</div>' +
        '<div class="si-meta">' + escHtml(s.id.slice(0,12)) + '</div></div>';
    });
    html += '<div class="si si-new" data-id="">+ 创建新会话</div>';
    scroll.innerHTML = html;

    scroll.querySelectorAll('.si').forEach(function(el) {
      el.addEventListener('click', function() {
        scroll.querySelectorAll('.si').forEach(function(x){x.classList.remove('selected')});
        el.classList.add('selected');
        _execState.sessionId = el.dataset.id || null;
        _execState.step = 'confirm';
        var b = document.getElementById('notesBtnExec');
        b.textContent = '确认执行';
        b.classList.remove('btn-secondary');
        b.classList.add('btn-primary');
      });
    });
  });
}

function _doExecute() {
  var state = _execState;
  _execState = null;
  _hideSessionList();
  _resetExecBtn();

  var taskId = S.taskId || '';
  var key = 'topo_exec_pending_' + taskId;
  var storeData = {refs: state.refs, userText: state.userText, sessionId: state.sessionId, autoDelete: state.autoDelete, ts: Date.now()};
  console.log('[exec-flow] executeDrafts: key=' + key, {refs: state.refs.length, userTextLen: state.userText.length, sessionId: state.sessionId});
  try {
    localStorage.setItem(key, JSON.stringify(storeData));
  } catch(e) { showToast('保存失败: ' + e.message); return; }

  var chatUrl = '/chat' + (taskId ? '?taskId=' + encodeURIComponent(taskId) : '');
  window.open(chatUrl);
  console.log('[exec-flow] executeDrafts: 新窗口→' + chatUrl);

  if (state.autoDelete) removeSelectedRefs();
  closeNotesModal();
  showToast('已发送到 AI 对话页');
}

function manualDrafts() {
  // 先刷新所有 textarea 到 _drafts
  document.querySelectorAll('#notesDraftList textarea').forEach(function(ta){
    var d = _drafts.find(function(x){return x.id===ta.dataset.draft});
    if (d && d.refs[parseInt(ta.dataset.ref)]) d.refs[parseInt(ta.dataset.ref)].text = ta.value;
  });
  var refs = getSelectedRefs();
  if (!refs.length) { showToast('请勾选要发送的引用材料'); return; }
  var userText = document.getElementById('notesUserText').value.trim();
  loadDrafts();
  var cboxes = document.querySelectorAll('#notesDraftList .cbox:checked');
  var pendingItems = [];
  cboxes.forEach(function(cb) {
    var d = _drafts.find(function(x){return x.id===cb.dataset.draft});
    if (d) { pendingItems.push({draftId: d.id, refIdx: parseInt(cb.dataset.ref), userText: userText}); }
  });
  if (pendingItems.length) {
    var nd = {id:'draft_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), seq:_draftSeq++, status:'pending', createdAt:new Date().toISOString(), refs:[], userText:userText};
    pendingItems.forEach(function(pi) {
      var d = _drafts.find(function(x){return x.id===pi.draftId});
      if (d && d.refs[pi.refIdx]) { nd.refs.push(d.refs[pi.refIdx]); d.refs.splice(pi.refIdx, 1); }
    });
    _drafts = _drafts.filter(function(d){return d.refs.length>0});
    _drafts.push(nd);
    saveDrafts();
    closeNotesModal();
    try { NotesStore._channel && NotesStore._channel.postMessage({type:'notes'}); } catch(e) {}
    showToast('已转交到 AI 对话页的便签栏');
  }
}

// ---- 事件绑定 ----

document.getElementById('toggleNotes').addEventListener('click', function() { console.log('[Notes] toggleNotes clicked'); loadDrafts(); openNotesModal(); });
document.getElementById('notesModalClose').addEventListener('click', closeNotesModal);
document.getElementById('notesFilterProj').addEventListener('change', renderDrafts);
document.getElementById('notesFilterSort').addEventListener('change', renderDrafts);
document.getElementById('notesBtnDelete').addEventListener('click', function() { removeSelectedRefs(); });
document.getElementById('notesBtnCancel').addEventListener('click', closeNotesModal);
document.getElementById('notesBtnManual').addEventListener('click', manualDrafts);
document.getElementById('notesBtnExec').addEventListener('click', executeDrafts);
document.getElementById('notesUserText').addEventListener('input', function(){this.style.height='auto';this.style.height=Math.max(56,this.scrollHeight)+'px'});

loadDrafts();
setInterval(function(){
  loadDrafts();
  if (document.getElementById('notesModal').style.display === 'flex') renderDrafts();
  updateDotBadge();
}, 30000);

</script>
