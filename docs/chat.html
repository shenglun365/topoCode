<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Chat · UI Demo</title>
    <!-- 使用 Inter 字体，接近 DeepSeek 的现代无衬线风格 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局重置 & 变量 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-sidebar: #f7f7f8;
            --bg-input: #ffffff;
            --bg-hover: #f0f0f2;
            --bg-bubble-user: #e8e8ea;
            --bg-bubble-ai: #ffffff;
            --border-light: #e4e4e7;
            --text-primary: #1a1a1a;
            --text-secondary: #6b6b76;
            --text-muted: #8e8e98;
            --accent: #4d6bfe;
            --accent-hover: #3a56d4;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --transition: 0.2s ease;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 整体布局 ===== */
        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== 侧边栏 (历史对话) ===== */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding: 16px 12px;
            transition: width 0.25s ease, opacity 0.2s ease;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .sidebar-header .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }

        .sidebar-header .logo i {
            color: var(--accent);
            font-size: 20px;
        }

        .btn-new-chat {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-full);
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: background var(--transition);
            white-space: nowrap;
        }

        .btn-new-chat:hover {
            background: var(--accent-hover);
        }

        .btn-new-chat i {
            font-size: 12px;
        }

        /* 历史列表 */
        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background var(--transition);
            position: relative;
        }

        .history-item:hover {
            background: var(--bg-hover);
        }

        .history-item .title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item .menu-btn {
            opacity: 0;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            transition: opacity var(--transition), background var(--transition);
        }

        .history-item:hover .menu-btn {
            opacity: 1;
        }

        .history-item .menu-btn:hover {
            background: var(--bg-hover);
        }

        .history-item.active {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* 侧边栏底部 */
        .sidebar-footer {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-footer .footer-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: var(--radius-md);
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background var(--transition);
            background: none;
            border: none;
            width: 100%;
            text-align: left;
        }

        .sidebar-footer .footer-btn:hover {
            background: var(--bg-hover);
        }

        .sidebar-footer .footer-btn i {
            width: 18px;
            text-align: center;
            color: var(--text-muted);
        }

        /* ===== 主对话区域 ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-primary);
            position: relative;
        }

        /* ===== 顶部栏 ===== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
            background: var(--bg-primary);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-left .hamburger {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            transition: background var(--transition);
            display: none;
            /* 默认隐藏，移动端可显示 */;
        }

        .topbar-left .hamburger:hover {
            background: var(--bg-hover);
        }

        .topbar-left .chat-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .topbar-right .icon-btn {
            background: none;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
            font-size: 15px;
        }

        .topbar-right .icon-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* ===== 消息区域 ===== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 16px 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* 消息气泡 */
        .message {
            display: flex;
            gap: 14px;
            max-width: 820px;
            margin: 0 auto;
            width: 100%;
            animation: fadeUp 0.3s ease;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            background: var(--accent);
        }

        .message-avatar.ai {
            background: #10a37f;
            /* 典型的 AI 绿色标识 */;
        }

        .message-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-content .sender {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .message-content .bubble {
            padding: 12px 16px;
            border-radius: var(--radius-lg);
            border-top-left-radius: 4px;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            background: var(--bg-bubble-ai);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }

        .message.user .bubble {
            background: var(--bg-bubble-user);
            border-color: transparent;
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: 4px;
        }

        .message.user .message-avatar {
            background: var(--text-secondary);
        }

        .message-content .actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            opacity: 0;
            transition: opacity var(--transition);
        }

        .message:hover .actions {
            opacity: 1;
        }

        .message-content .actions button {
            background: none;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message-content .actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .message-content .actions button i {
            font-size: 13px;
        }

        /* ===== 模式选择器 (快速 / 专家) ===== */
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 0 24px 12px 24px;
            flex-shrink: 0;
        }

        .mode-selector .mode-btn {
            background: none;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-full);
            padding: 6px 18px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-selector .mode-btn i {
            font-size: 13px;
        }

        .mode-selector .mode-btn:hover {
            background: var(--bg-hover);
        }

        .mode-selector .mode-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .mode-selector .mode-btn .badge {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.2);
            padding: 1px 8px;
            border-radius: var(--radius-full);
            color: inherit;
        }

        .mode-selector .mode-btn.active .badge {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ===== 输入区域 ===== */
        .input-area {
            padding: 0 24px 24px 24px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-wrapper {
            max-width: 820px;
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            transition: border-color var(--transition), box-shadow var(--transition);
            display: flex;
            flex-direction: column;
            padding: 6px 8px 6px 16px;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(77, 107, 254, 0.12);
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .input-row textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-family: var(--font-sans);
            font-size: 15px;
            line-height: 1.5;
            padding: 8px 0;
            min-height: 28px;
            max-height: 160px;
            color: var(--text-primary);
            background: transparent;
        }

        .input-row textarea::placeholder {
            color: var(--text-muted);
        }

        .input-row .toolbar-btn {
            background: none;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
            font-size: 16px;
            flex-shrink: 0;
        }

        .input-row .toolbar-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .input-row .btn-send {
            background: var(--accent);
            color: #fff;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background var(--transition), opacity var(--transition);
            flex-shrink: 0;
        }

        .input-row .btn-send:hover {
            background: var(--accent-hover);
        }

        .input-row .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* 输入框底部附属按钮 (深度思考 / 联网搜索 / 附件) */
        .input-tools {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0 2px 0;
            flex-wrap: wrap;
        }

        .input-tools .tool-chip {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px 4px 8px;
            border-radius: var(--radius-full);
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
            border: 1px solid transparent;
        }

        .input-tools .tool-chip:hover {
            background: var(--bg-hover);
        }

        .input-tools .tool-chip i {
            font-size: 13px;
        }

        .input-tools .tool-chip.active {
            background: rgba(77, 107, 254, 0.08);
            color: var(--accent);
            border-color: rgba(77, 107, 254, 0.2);
        }

        .input-tools .tool-chip .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
        }

        .input-tools .spacer {
            flex: 1;
        }

        .input-tools .char-count {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ===== 动画 ===== */
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 100;
                transform: translateX(-100%);
                width: 280px;
                box-shadow: var(--shadow-md);
                transition: transform 0.25s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .topbar-left .hamburger {
                display: flex;
            }

            .messages {
                padding: 16px 16px 12px 16px;
            }

            .input-area {
                padding: 0 12px 16px 12px;
            }

            .mode-selector {
                padding: 0 12px 8px 12px;
                flex-wrap: wrap;
            }

            .topbar {
                padding: 10px 16px;
            }

            .message {
                max-width: 100%;
            }
        }

        /* 简单滚动条样式 */
        .messages::-webkit-scrollbar,
        .history-list::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-track,
        .history-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb,
        .history-list::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ===== 侧边栏 ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-brain"></i>
                    <span>DeepSeek</span>
                </div>
                <button class="btn-new-chat" id="newChatBtn">
                    <i class="fas fa-plus"></i> 新对话
                </button>
            </div>

            <div class="history-list" id="historyList">
                <!-- 由 JS 动态渲染 -->
            </div>

            <div class="sidebar-footer">
                <button class="footer-btn">
                    <i class="fas fa-download"></i> 下载 App
                </button>
                <button class="footer-btn" id="settingsBtn">
                    <i class="fas fa-user-circle"></i> 个人信息
                </button>
            </div>
        </aside>

        <!-- ===== 主区域 ===== -->
        <main class="main">

            <!-- 顶部栏 -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="hamburger" id="hamburgerBtn" aria-label="切换侧边栏">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="chat-title" id="chatTitle">新对话</span>
                </div>
                <div class="topbar-right">
                    <button class="icon-btn" title="更多"><i class="fas fa-ellipsis-v"></i></button>
                </div>
            </header>

            <!-- 消息列表 -->
            <div class="messages" id="messagesContainer">
                <!-- 由 JS 动态渲染 -->
            </div>

            <!-- 模式选择器 (快速 / 专家) -->
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="fast">
                    <i class="fas fa-bolt"></i> 快速模式
                    <span class="badge">日常对话</span>
                </button>
                <button class="mode-btn" data-mode="expert">
                    <i class="fas fa-gem"></i> 专家模式
                    <span class="badge">复杂问题</span>
                </button>
            </div>

            <!-- 输入区域 -->
            <div class="input-area">
                <div class="input-wrapper">
                    <div class="input-row">
                        <textarea id="chatInput" rows="1" placeholder="给 DeepSeek 发送消息..." aria-label="输入消息"></textarea>
                        <button class="toolbar-btn" title="上传附件"><i class="fas fa-paperclip"></i></button>
                        <button class="btn-send" id="sendBtn" aria-label="发送">
                            <i class="fas fa-arrow-up"></i>
                        </button>
                    </div>
                    <div class="input-tools">
                        <button class="tool-chip" id="deepThinkBtn">
                            <i class="fas fa-microchip"></i> 深度思考
                        </button>
                        <button class="tool-chip" id="webSearchBtn">
                            <i class="fas fa-globe"></i> 联网搜索
                        </button>
                        <span class="spacer"></span>
                        <span class="char-count" id="charCount">0</span>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // ============================================================
        //  JS 交互 —— 模拟 DeepSeek 风格对话
        // ============================================================

        (function() {
            'use strict';

            // ----- DOM 引用 -----
            const sidebar = document.getElementById('sidebar');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const historyList = document.getElementById('historyList');
            const messagesContainer = document.getElementById('messagesContainer');
            const chatInput = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');
            const newChatBtn = document.getElementById('newChatBtn');
            const chatTitle = document.getElementById('chatTitle');
            const charCount = document.getElementById('charCount');
            const deepThinkBtn = document.getElementById('deepThinkBtn');
            const webSearchBtn = document.getElementById('webSearchBtn');
            const modeBtns = document.querySelectorAll('.mode-btn');

            // ----- 状态 -----
            let currentChatId = Date.now().toString(36);
            let chats = []; // { id, title, messages: [{ role, content }] }
            let currentMode = 'fast'; // 'fast' | 'expert'
            let isDeepThink = false;
            let isWebSearch = false;

            // ----- 初始化示例数据 -----
            function initDemoData() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

                chats = [{
                    id: currentChatId,
                    title: '新对话',
                    messages: [
                        { role: 'ai', content: '你好！我是 DeepSeek，有什么可以帮你的吗？' }
                    ]
                }, {
                    id: 'demo-' + Date.now(),
                    title: 'Python 入门建议',
                    messages: [
                        { role: 'user', content: '我想学 Python，有什么建议吗？' },
                        { role: 'ai', content: '很高兴你想学 Python！我建议你从官方文档和基础语法开始，每天练习 30 分钟，两周后就能掌握核心概念。' }
                    ]
                }, {
                    id: 'demo-' + (Date.now() + 1),
                    title: '今日新闻摘要',
                    messages: [
                        { role: 'user', content: '今天有什么重要新闻？' },
                        { role: 'ai', content: '根据最新信息，今天科技圈关注 AI 模型更新，同时财经市场整体平稳。需要我展开讲讲吗？' }
                    ]
                }];

                // 确保当前 chat 存在
                const exists = chats.find(c => c.id === currentChatId);
                if (!exists) {
                    chats.unshift({
                        id: currentChatId,
                        title: '新对话',
                        messages: [{ role: 'ai', content: '你好！我是 DeepSeek，有什么可以帮你的吗？' }]
                    });
                }
            }

            // ----- 渲染函数 -----

            // 渲染历史列表
            function renderHistory() {
                historyList.innerHTML = '';
                chats.forEach(chat => {
                    const div = document.createElement('div');
                    div.className = 'history-item' + (chat.id === currentChatId ? ' active' : '');
                    div.innerHTML = `
                        <span class="title">${chat.title}</span>
                        <button class="menu-btn" data-chatid="${chat.id}" title="更多操作"><i class="fas fa-ellipsis-v"></i></button>
                    `;
                    // 点击切换对话
                    div.addEventListener('click', (e) => {
                        // 如果点的是菜单按钮，不切换
                        if (e.target.closest('.menu-btn')) return;
                        switchChat(chat.id);
                    });
                    // 菜单按钮：简单删除演示
                    const menuBtn = div.querySelector('.menu-btn');
                    menuBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (confirm(`删除对话“${chat.title}”？`)) {
                            deleteChat(chat.id);
                        }
                    });
                    historyList.appendChild(div);
                });
            }

            // 渲染消息
            function renderMessages(chatId) {
                const chat = chats.find(c => c.id === chatId);
                if (!chat) return;

                messagesContainer.innerHTML = '';
                chat.messages.forEach((msg, index) => {
                    const div = document.createElement('div');
                    div.className = `message ${msg.role === 'user' ? 'user' : 'ai'}`;

                    const avatarLabel = msg.role === 'user' ? '你' : 'AI';
                    const avatarClass = msg.role === 'user' ? '' : 'ai';

                    div.innerHTML = `
                        <div class="message-avatar ${avatarClass}">${avatarLabel}</div>
                        <div class="message-content">
                            <div class="sender">${msg.role === 'user' ? '你' : 'DeepSeek'}</div>
                            <div class="bubble">${escapeHtml(msg.content)}</div>
                            <div class="actions">
                                <button><i class="far fa-copy"></i> 复制</button>
                                <button><i class="fas fa-redo"></i> 重新生成</button>
                                <button><i class="far fa-thumbs-up"></i></button>
                                <button><i class="far fa-thumbs-down"></i></button>
                            </div>
                        </div>
                    `;

                    messagesContainer.appendChild(div);
                });

                // 滚动到底部
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                updateChatTitle(chat.title);
            }

            // 更新标题
            function updateChatTitle(title) {
                chatTitle.textContent = title || '新对话';
            }

            // 简单防 XSS
            function escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, function(m) { return map[m]; });
            }

            // ----- 操作函数 -----

            // 切换对话
            function switchChat(chatId) {
                const chat = chats.find(c => c.id === chatId);
                if (!chat) return;
                currentChatId = chatId;
                renderHistory();
                renderMessages(currentChatId);
                // 移动端关闭侧栏
                sidebar.classList.remove('open');
            }

            // 删除对话
            function deleteChat(chatId) {
                const idx = chats.findIndex(c => c.id === chatId);
                if (idx === -1) return;
                chats.splice(idx, 1);
                if (chats.length === 0) {
                    // 创建一个新对话
                    const newId = Date.now().toString(36);
                    chats.push({
                        id: newId,
                        title: '新对话',
                        messages: [{ role: 'ai', content: '你好！我是 DeepSeek，有什么可以帮你的吗？' }]
                    });
                    currentChatId = newId;
                } else if (currentChatId === chatId) {
                    currentChatId = chats[0].id;
                }
                renderHistory();
                renderMessages(currentChatId);
            }

            // 创建新对话
            function createNewChat() {
                const newId = Date.now().toString(36);
                chats.unshift({
                    id: newId,
                    title: '新对话',
                    messages: [{ role: 'ai', content: '你好！我是 DeepSeek，有什么可以帮你的吗？' }]
                });
                currentChatId = newId;
                renderHistory();
                renderMessages(currentChatId);
                chatInput.value = '';
                updateCharCount();
                // 移动端关闭侧栏
                sidebar.classList.remove('open');
            }

            // 发送消息
            function sendMessage() {
                const text = chatInput.value.trim();
                if (!text) return;

                const chat = chats.find(c => c.id === currentChatId);
                if (!chat) return;

                // 添加用户消息
                chat.messages.push({ role: 'user', content: text });
                chatInput.value = '';
                updateCharCount();

                // 如果当前是 "新对话" 且只有一条 AI 欢迎语，用用户输入的前 20 字作为标题
                if (chat.title === '新对话' && chat.messages.length === 2) {
                    const newTitle = text.slice(0, 20) + (text.length > 20 ? '...' : '');
                    chat.title = newTitle;
                }

                renderMessages(currentChatId);
                renderHistory();

                // 模拟 AI 回复
                const thinking = isDeepThink ? ' (深度思考)' : '';
                const modeLabel = currentMode === 'fast' ? '快速' : '专家';
                const searchLabel = isWebSearch ? ' 🔍 已联网' : '';

                const replies = [
                    `这是 ${modeLabel}模式${thinking} 下的回复${searchLabel}。你问的是：「${text}」—— 这是个很好的问题！`,
                    `收到！${modeLabel}模式${thinking} 正在处理${searchLabel}。关于「${text}」，我的理解是...`,
                    `有趣的问题！${modeLabel}模式${thinking} 分析中${searchLabel}。针对「${text}」，我的建议是...`
                ];

                const reply = replies[Math.floor(Math.random() * replies.length)];

                setTimeout(() => {
                    chat.messages.push({ role: 'ai', content: reply });
                    renderMessages(currentChatId);
                    renderHistory();
                }, 400 + Math.random() * 400);
            }

            // 更新字数统计
            function updateCharCount() {
                const len = chatInput.value.length;
                charCount.textContent = len;
            }

            // ----- 事件绑定 -----

            // 发送按钮
            sendBtn.addEventListener('click', sendMessage);

            // 回车发送 (Shift+Enter 换行)
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // 字数统计
            chatInput.addEventListener('input', updateCharCount);

            // 新对话
            newChatBtn.addEventListener('click', createNewChat);

            // 汉堡菜单 (移动端)
            hamburgerBtn.addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });

            // 点击外部关闭侧栏 (移动端)
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 768) {
                    const isSidebar = sidebar.contains(e.target);
                    const isHamburger = hamburgerBtn.contains(e.target);
                    if (!isSidebar && !isHamburger) {
                        sidebar.classList.remove('open');
                    }
                }
            });

            // 深度思考切换
            deepThinkBtn.addEventListener('click', () => {
                isDeepThink = !isDeepThink;
                deepThinkBtn.classList.toggle('active');
            });

            // 联网搜索切换
            webSearchBtn.addEventListener('click', () => {
                isWebSearch = !isWebSearch;
                webSearchBtn.classList.toggle('active');
            });

            // 模式切换
            modeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    modeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentMode = btn.dataset.mode;
                });
            });

            // 个人信息按钮 (演示)
            document.getElementById('settingsBtn').addEventListener('click', () => {
                alert('个人信息设置 (演示)');
            });

            // 自适应文本框高度
            chatInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 160) + 'px';
            });

            // ----- 启动 -----
            initDemoData();
            renderHistory();
            renderMessages(currentChatId);
            updateCharCount();

            // 默认激活深度思考和联网搜索的样式 (演示)
            // 默认不激活

            console.log('DeepSeek UI Demo 已启动 🚀');
        })();
    </script>

</body>
</html>
